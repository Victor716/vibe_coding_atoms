[project]
name = "vibe-sandbox"
version = "0.1.0"
description = "sandbox-agent · ECS 上 ~100 行 FastAPI mini-PaaS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "docker>=7.1",
    "aiofiles>=24.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
